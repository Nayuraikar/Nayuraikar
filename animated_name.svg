<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
      <animate attributeName="x1" values="0%;-100%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%;100%" dur="5s" repeatCount="indefinite" />
    </linearGradient>
    <style>
      .name {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: 3px;
        text-transform: uppercase;
        fill: url(#gradient);
      }
    </style>
  </defs>
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" class="name">NAYANA JAGADISH RAIKAR</text>
</svg>
